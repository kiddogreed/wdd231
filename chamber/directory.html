<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory | Makati Chamber of Commerce</title>
    <meta name="description" content="Browse member businesses of the Makati Chamber of Commerce in a grid or list view.">
    <meta name="author" content="John Russelle R Domingo">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">

    <!-- Facebook / Open Graph -->
    <meta property="og:title" content="Directory | Makati Chamber of Commerce">
    <meta property="og:description" content="Browse member businesses of the Makati Chamber of Commerce in a grid or list view.">
    <meta property="og:image" content="https://kiddogreed.github.io/wdd231/chamber/images/chamber-share.svg">
    <meta property="og:url" content="https://kiddogreed.github.io/wdd231/chamber/directory.html">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- JavaScript Files -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/directory.js" defer></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.svg" alt="Makati Chamber of Commerce logo" width="40" height="40">
            <span>Makati Chamber of Commerce</span>
        </div>
        <button id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav">&#9776;</button>
    </header>

    <nav id="primary-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="directory.html" class="active" aria-current="page">Directory</a></li>
            <li><a href="join.html">Join</a></li>
        </ul>
    </nav>

    <main>
        <h1>Member Directory</h1>

        <div class="directory-controls">
            <p id="member-count"></p>
            <div class="view-buttons">
                <button id="grid-btn" aria-pressed="true" aria-label="Show grid view">Grid</button>
                <button id="list-btn" aria-pressed="false" aria-label="Show list view">List</button>
            </div>
        </div>

        <section id="members-container" aria-live="polite">
            <!-- Dynamically populated via directory.js -->
        </section>
    </main>

    <footer>
        <div class="footer-contact">
            <p>Makati Chamber of Commerce &bull; 1 Ayala Ave, Makati City, 1226 Metro Manila</p>
            <p>Phone: (02) 8888-1000 &bull; Email: info@makatichamber.example.com</p>
        </div>
        <p>&copy; <span id="currentyear"></span> John Russelle R Domingo &bull; WDD 231</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
